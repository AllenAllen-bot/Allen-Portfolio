name: Cache Portfolio Photos

on:
  push:
    branches: [main]
    paths:
      - gallery.html
      - .github/workflows/cache-portfolio-photos.yml
  workflow_dispatch:

concurrency:
  group: portfolio-photo-cache
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Download reference photos to repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/portfolio-photos
          failures=0
          while IFS='|' read -r filename url; do
            [ -z "$filename" ] && continue
            target="assets/portfolio-photos/$filename"
            if [ -s "$target" ]; then continue; fi
            if ! curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 "$url" -o "$target"; then
              echo "::warning::Failed to download $filename; website can use its remote fallback"
              rm -f "$target"
              failures=$((failures+1))
            fi
          done <<'PHOTO_LIST'
          cars-01.jpg|https://images.unsplash.com/photo-1503376780353-7e6692767b70?fm=jpg&fit=crop&w=1000&q=78
          cars-02.jpg|https://images.unsplash.com/photo-1544636331-e26879cd4d9b?fm=jpg&fit=crop&w=1000&q=78
          cars-03.jpg|https://images.unsplash.com/photo-1494905998402-395d579af36f?fm=jpg&fit=crop&w=1000&q=78
          cars-04.jpg|https://images.unsplash.com/photo-1552519507-da3b142c6e3d?fm=jpg&fit=crop&w=1000&q=78
          animals-01.jpg|https://images.unsplash.com/photo-1546182990-dffeafbe841d?fm=jpg&fit=crop&w=1000&q=78
          animals-02.jpg|https://images.unsplash.com/photo-1517849845537-4d257902454a?fm=jpg&fit=crop&w=1000&q=78
          animals-03.jpg|https://images.unsplash.com/photo-1551969014-7d2c4cddf0b6?fm=jpg&fit=crop&w=1000&q=78
          animals-04.jpg|https://images.unsplash.com/photo-1484406566174-9da000fda645?fm=jpg&fit=crop&w=1000&q=78
          birds-01.jpg|https://images.unsplash.com/photo-1710098213129-8ff0efb0e0fc?fm=jpg&fit=crop&w=1000&q=78
          birds-02.jpg|https://images.unsplash.com/photo-1452570053594-1b985d6ea890?fm=jpg&fit=crop&w=1000&q=78
          fishes-01.jpg|https://images.unsplash.com/photo-1524096613842-71a8c45f08a2?fm=jpg&fit=crop&w=1000&q=78
          fishes-02.jpg|https://images.unsplash.com/photo-1544551763-46a013bb70d5?fm=jpg&fit=crop&w=1000&q=78
          flowers-01.jpg|https://images.unsplash.com/photo-1490750967868-88aa4486c946?fm=jpg&fit=crop&w=1000&q=78
          flowers-02.jpg|https://images.unsplash.com/photo-1457089328109-e5d9bd499191?fm=jpg&fit=crop&w=1000&q=78
          plants-01.jpg|https://images.unsplash.com/photo-1545241047-6083a3684587?fm=jpg&fit=crop&w=1000&q=78
          plants-02.jpg|https://images.unsplash.com/photo-1501004318641-b39e6451bec6?fm=jpg&fit=crop&w=1000&q=78
          PHOTO_LIST
          echo "Failed downloads: $failures"
      - name: Commit cached photos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio-photos/
          if ! git diff --cached --quiet; then
            git commit -m "Cache curated Portfolio category photos locally"
            git push origin HEAD:main
          fi
